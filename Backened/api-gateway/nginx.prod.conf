map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /api/auth {
    proxy_pass http://auth-service:4001/auth;
  }

  location /api/diagrams {
    proxy_pass http://diagram-service:4002/diagrams;
  }

  location /api/prompts {
    proxy_pass http://diagram-service:4002/prompts;
  }

  location /api/review {
    proxy_pass http://review-service:4004/review;
  }

  location /socket.io/ {
    proxy_pass http://room-service:4003;
  }

  location / {
    proxy_pass http://frontend:3000;
  }
}