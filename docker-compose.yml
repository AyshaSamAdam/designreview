version: "3.9"

services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-diagram:
    image: postgres:16
    environment:
      POSTGRES_DB: diagram_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5434:5432"
    volumes:
      - diagram_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d diagram_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-review:
    image: postgres:16
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5435:5432"
    volumes:
      - review_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d review_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Backened/api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  review-service:
    profiles: ["apps"]
    build: ./Backened/services/review-service
    ports:
      - "4004:4004"
    env_file:
      - ./Backened/services/review-service/.env
    environment:
      DATABASE_URL: postgresql://dev:devpassword@postgres-review:5432/review_db
    depends_on:
      postgres-review:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"
  
  auth-service:
    profiles: ["apps"]
    build: ./Backened/services/auth-service
    ports:
      - "4001:4001"
    env_file:
      - ./Backened/services/auth-service/.env
    environment:
      DATABASE_URL: postgres://dev:devpassword@postgres-auth:5432/auth_db
    depends_on:
      postgres-auth:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"


  diagram-service:
    profiles: ["apps"]
    build: ./Backened/services/diagram-service
    ports:
      - "4002:4002"
    env_file:
      - ./Backened/services/diagram-service/.env
    environment:
      DATABASE_URL: postgres://dev:devpassword@postgres-diagram:5432/diagram_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-diagram:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"

  room-service:
    profiles: ["apps"]
    build: ./Backened/services/room-service
    ports:
      - "4003:4003"
    env_file:
      - ./Backened/services/room-service/.env
    environment:
      REDIS_URL: redis://redis:6379
      DIAGRAM_SERVICE_URL: http://diagram-service:4002
    depends_on:
      redis:
        condition: service_started
      diagram-service:
        condition: service_started


volumes:
  auth_data:
  diagram_data:
  review_data: